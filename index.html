<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Body Garden</title>
<meta name="description" content="体重・体組成・タンパク質・注射・体調を静かに整えて記録するセルフマネジメントアプリ" />
<meta name="theme-color" content="#d9a9ac" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Body Garden" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css?t=51" />
</head>
<body>
<main>
  <section data-screen="home"><!-- UI.renderHome() が内容を描画 --></section>

  <section data-screen="records" hidden><div id="records-root"></div></section>

  <section data-screen="injection" hidden>
    <div class="card">
      <p class="card-title">注射スケジュール</p>
      <div class="placeholder-box">Phase4で実装予定（予定日・実施記録・次回提案）</div>
    </div>
  </section>

  <section data-screen="composition" hidden>
    <div class="card">
      <p class="card-title"><span class="title-icon-slot" data-line-icon="composition" data-icon-class="title-icon-svg"></span>体組成</p>
      <div class="placeholder-box">Phase5で実装予定（詳細項目入力・画像読み取り＋確認画面）</div>
    </div>
  </section>

  <section data-screen="settings" hidden>
    <div id="settings-root"></div>
    <div id="protein-settings-root"></div>
  </section>

  <!-- ナビゲーションには出さない。BMI21/BMI20ガードレールから遷移する内部画面 -->
  <section data-screen="maintenance-prep" hidden><div id="maintenance-prep-root"></div></section>
</main>

<nav class="bottom-nav">
  <button data-nav-target="home">
    <span class="nav-icon-slot" data-line-icon="home" data-icon-class="nav-icon-svg"></span>HOME
  </button>
  <button data-nav-target="records">
    <span class="nav-icon-slot" data-line-icon="records" data-icon-class="nav-icon-svg"></span>記録
  </button>
  <button data-nav-target="injection">
    <span class="nav-icon-slot" data-line-icon="injection" data-icon-class="nav-icon-svg"></span>注射
  </button>
  <button data-nav-target="composition">
    <span class="nav-icon-slot" data-line-icon="composition" data-icon-class="nav-icon-svg"></span>体組成
  </button>
  <button data-nav-target="settings">
    <span class="nav-icon-slot" data-line-icon="settings" data-icon-class="nav-icon-svg"></span>設定
  </button>
</nav>

<div id="modal-root" class="modal-root" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/icons.js?t=9"></script>
<script src="js/data.js?t=21"></script>
<script src="js/calc.js?t=9"></script>
<script src="js/storage.js?t=9"></script>
<script src="js/logic.js?t=9"></script>
<script src="js/charts.js?t=32"></script>
<script src="js/ocr.js?t=9"></script>
<script src="js/ui.js?t=43"></script>
<script src="js/protein-logic.js?t=9"></script>
<script src="js/ui-settings.js?t=9"></script>
<script src="js/ui-protein-settings.js?t=9"></script>
<script src="js/ui-protein-home.js?t=22"></script>
<script src="js/ui-records.js?t=9"></script>
<script src="js/app.js?t=9"></script>
</body>
</html>
